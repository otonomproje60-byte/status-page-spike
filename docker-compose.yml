version: '3.8'

services:
  status-page:
    build: .
    container_name: status-page-spike
    ports:
      - "5004:5004"
    volumes:
      - status_data:/data
    environment:
      - DB_PATH=/data/status.db
      - PORT=5004
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  status_data: